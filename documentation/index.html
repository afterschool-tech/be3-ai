<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentation</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M10 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 12h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-arrow-right" viewBox="0 0 24 24">
      <path d="M14 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 12H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5V5.5A2.5 2.5 0 0 1 6.5 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

      <path d="M2 12l10 6 10-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 16l10 6 10-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>

    <symbol id="i-settings" viewBox="0 0 24 24">

    </symbol>

    <symbol id="i-broom" viewBox="0 0 24 24">
      <path d="M4 20l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 14l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M10 12l8-8a2.5 2.5 0 0 1 3.5 3.5l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 21c4-1 8-5 9-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon icon--lg" role="img" aria-label="Documentation">
            <use href="#i-book"></use>
          </svg>
        </span>
        <span class="brand-title">Project Documentation</span>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1 class="hero__title">Documentation Hub</h1>
        <p class="hero__subtitle">Each folder under <code>documentation/</code> is a reusable documentation set.</p>
      </section>

      <section class="card-grid" aria-label="Documentation sets">
        <a class="card" href="./intentResolverwordinventoy/index.html">
          <div class="card__icon" aria-hidden="true">
            <svg class="icon icon--lg"><use href="#i-brain"></use></svg>
          </div>
          <div class="card__body">
            <div class="card__title">IntentResolver Word Inventory</div>
            <div class="card__desc">All lexicons/word lists, what they do, and how to extend them safely.</div>
          </div>
          <div class="card__chev" aria-hidden="true">→</div>
        </a>
      </section>

      <section class="footer-note">
        <div class="muted">Next planned set: pipeline stages documentation.</div>
      </section>
    </main>
  </div>
</body>
</html>
